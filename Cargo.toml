[workspace]
resolver = "2"
members = [
    "crates/nitr-core",
    "crates/nitr-std",
    "crates/nitr-http",
    "crates/nitr",
    "crates/nitr-cli",
]

[workspace.package]
version = "0.0.0-beta.1"
edition = "2024"
rust-version = "1.88.0"
authors = ["Jose Quintana <https://joseluisq.net>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/joseluisq/nitr"
homepage = "https://github.com/joseluisq/nitr"

[workspace.package.metadata.docs.rs]
features = ["all"]
rustdoc-args = ["--cfg", "docsrs"]

# Cross: workaround for https://github.com/cross-rs/cross/issues/1345
[workspace.package.metadata.cross.target.x86_64-unknown-netbsd]
pre-build = [
    "mkdir -p /tmp/netbsd",
    "curl -fO https://ftp.uni-erlangen.de/netbsd/NetBSD-9.4/amd64/binary/sets/base.tar.xz",
    "tar -C /tmp/netbsd -xJf base.tar.xz",
    "cp /tmp/netbsd/usr/lib/libexecinfo.so /usr/local/x86_64-unknown-netbsd/lib",
    "rm -rf base.tar.xz /tmp/netbsd",
]

[workspace.dependencies]
# Workspace crates
nitr-core = { version = "0.0.0-beta.1", path = "crates/nitr-core" }
nitr-std = { version = "0.0.0-beta.1", path = "crates/nitr-std" }
nitr-http = { version = "0.0.0-beta.1", path = "crates/nitr-http" }
nitr = { version = "0.0.0-beta.1", path = "crates/nitr" }

# External
anyhow = "1.0"
argon2 = "0.5"
async-channel = "2.3"
base64 = "0.22"
bitflags = "2.9"
# `default-features = false` drops the C/ffi and std-alloc extras; the pure
# Rust encoder is all the response compressor needs.
brotli = { version = "8.0", default-features = false, features = ["std"] }
bytes = "1.12"
cookie = "0.18"
flate2 = "1.1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
getrandom = "0.2"
hmac = "0.12"
sha2 = "0.10"
http = "1.3"
http-body-util = "0.1.5"
httpdate = "1.0"
hyper = { version = "1.11", features = ["full"] }
hyper-util = { version = "0.1.11", features = ["full"] }
matchit = "0.8"
mime_guess = "2.0"
minijinja = { version = "2.24.0", features = ["loader"] }
multer = "3.1"
percent-encoding = "2.3"
mlua = { version = "0.12", features = ["async", "macros", "lua54", "serialize", "vendored", "anyhow", "send"] }
reqwest = { version = "0.12.15", features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.140"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync", "fs", "io-util"] }
toml = "0.8"
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

# Release with debug symbols, for profiling (perf).
[profile.profiling]
inherits = "release"
debug = true
strip = false

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
lto = "fat"
opt-level = 3
panic = "abort"
rpath = false
strip = true

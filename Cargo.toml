[workspace]
resolver = "2"
members = [
    "crates/nitr-core",
    "crates/nitr-lua",
    "crates/nitr-http",
    "crates/nitr",
    "crates/nitr-cli",
]

[workspace.package]
version = "0.0.0-beta.1"
edition = "2021"
rust-version = "1.82.0"
authors = ["Jose Quintana <https://joseluisq.net>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/joseluisq/nitr"
homepage = "https://github.com/joseluisq/nitr"

[workspace.dependencies]
# Workspace crates
nitr-core = { version = "0.0.0-beta.1", path = "crates/nitr-core" }
nitr-lua = { version = "0.0.0-beta.1", path = "crates/nitr-lua" }
nitr-http = { version = "0.0.0-beta.1", path = "crates/nitr-http" }
nitr = { version = "0.0.0-beta.1", path = "crates/nitr" }

# External
anyhow = "1.0"
async-channel = "2.3"
base64 = "0.22"
bitflags = "2.9"
bytes = "1.12"
cookie = "0.18"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
http = "1.3"
http-body-util = "0.1.5"
httpdate = "1.0"
hyper = { version = "1.11", features = ["full"] }
hyper-util = { version = "0.1.11", features = ["full"] }
matchit = "0.8"
mime_guess = "2.0"
minijinja = { version = "2.24.0", features = ["loader"] }
percent-encoding = "2.3"
mlua = { version = "0.12", features = ["async", "macros", "lua54", "serialize", "vendored", "anyhow", "send"] }
reqwest = { version = "0.12.15", features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync", "fs", "io-util"] }
toml = "0.8"
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

# Release with debug symbols, for profiling (perf).
[profile.profiling]
inherits = "release"
debug = true
strip = false

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
lto = "fat"
opt-level = 3
panic = "abort"
rpath = false
strip = true

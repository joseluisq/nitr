# Paths are relative to the process working directory (the repo root when
# run via `cargo run -p nitr-cli`).
listen = "127.0.0.1:3000"
handler_script = "crates/nitr/examples/app-package/app.lua"
config_script = "crates/nitr/examples/app-package/config.lua"

[database]
path = "/tmp/nitr-app-package.db"

[testing]
dir = "crates/nitr/examples/app-package/tests"

# Opt into the `db` standard library feature on top of the minimal
# defaults (json, http, log, time, validate, base64, path, url).
[std]
features = ["json", "http", "log", "db"]

[static]
dir = "crates/nitr/examples/app-package/public"
mount = "/"
